services:
  fieldpal-pg-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    container_name: fieldpal-pg-db-container
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PGSQL_PORT_PUBLIC}:5432
    volumes:
      - fieldpal-pg-data:/var/lib/postgresql
    networks:
      fieldpal-pg-network:
        ipv4_address: 172.22.0.251
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fieldpal-pg-adminer-db:
    image: adminer
    container_name: fieldpal-pg-adminer-db-container
    restart: unless-stopped
    ports:
      - 8181:8080
    depends_on:
      - fieldpal-pg-db
    networks:
      fieldpal-pg-network:
        ipv4_address: 172.22.0.253

  fieldpal-pg-pgadmin4:
    container_name: fieldpal-pgadmin4-container
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "adminDB@fieldpal.org"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
    ports:
      - 8182:80
    depends_on:
      - fieldpal-pg-db
    networks:
      fieldpal-pg-network:
        ipv4_address: 172.22.0.254

networks:
  fieldpal-pg-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/24

volumes:
  fieldpal-pg-data:
    name: fieldpal-pg-data-local
